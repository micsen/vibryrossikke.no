<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elsker Karaoke Link Admin</title>
        <style>
            body {
                background-color: #121212;
                color: #ffffff;
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .form-container {
                background-color: #1e1e1e;
                padding: 20px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            }

            .form-container input {
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                border: none;
                border-radius: 4px;
                background-color: #333;
                box-sizing: border-box;
                color: #fff;
            }

            .form-container input[type="submit"] {
                background-color: #6200ea;
                cursor: pointer;
            }

            .form-container input[type="submit"]:hover {
                background-color: #3700b3;
            }
        </style>
    </head>

    <body>
        <div class="form-container">
            <form>
                <input id="password" type="password" placeholder="Enter your password" required>
                <input id="url" type="text" placeholder="Enter a URL" required>
                <input type="submit" value="Start forwarding users">
            </form>
            <script>
                let interval = null
                var w
                document.addEventListener('DOMContentLoaded', function () {
                    if (typeof (Worker) !== "undefined") {
                        if (typeof (w) == "undefined") {
                            w = new Worker("worker.js")
                        }
                    }

                    const storedPassword = localStorage.getItem('password')
                    const storedUrl = localStorage.getItem('url')

                    if (storedPassword) {
                        document.getElementById('password').value = storedPassword
                    }
                    if (storedUrl) {
                        document.getElementById('url').value = storedUrl
                    }

                    document.querySelector('form').addEventListener('submit', function (event) {
                        event.preventDefault()

                        const url = document.getElementById('url').value
                        const password = document.getElementById('password').value

                        localStorage.setItem('password', password)
                        localStorage.setItem('url', url)
                        const formContainer = document.querySelector('.form-container')
                        formContainer.innerHTML = `<p>Vibryrossikke.no will forward the user to ${url}</p>`

                        w.postMessage({
                            path: password,
                            url: url
                        })
                    })
                });
            </script>
        </div>
    </body>

</html>
