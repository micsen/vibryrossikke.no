<!DOCTYPE html>
<html lang="en">
    <!--https://sockethook.ericbetts.dev/-->

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loading...</title>
        <style>
            body {
                background-color: #121212;
                color: #ffffff;
            }

            .spinner {
                border: 16px solid #424242;
                border-top: 16px solid #bb86fc;
                border-radius: 50%;
                width: 120px;
                height: 120px;
                animation: spin 2s linear infinite;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div class="spinner"></div>
        <script>
            const socket = new WebSocket('wss://websocket.ericbetts.dev')
            const sha256OfPassword = "a70a82628f334c23ff5a0ab0dbc086725ec3c56d3b5745024d6cd4d751a3213d"
            socket.addEventListener('open', function (event) {
                console.log('Connected to the WebSocket server')
                const subscription = {
                    action: 'subscribe',
                    key: sha256OfPassword
                }
                socket.send(JSON.stringify(subscription))
            })

            socket.addEventListener('message', function (event) {
                console.log('Message from server ', event.data)
                const data = JSON.parse(event.data)
                if (data.url) {
                    window.location.href = data.url
                }
            })

            socket.addEventListener('close', function (event) {
                console.log('Disconnected from the WebSocket server')
            })

            socket.addEventListener('error', function (event) {
                console.error('WebSocket error: ', event)
            });
        </script>
    </body>

</html>
