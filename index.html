<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elsker Karaoke...</title>
        <style>
            body {
                background-color: #121212;
                color: #ffffff;
            }

            .spinnerContainer {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }

            .spinner {
                border: 16px solid #424242;
                border-top: 16px solid #bb86fc;
                border-radius: 50%;
                width: 120px;
                height: 120px;
                animation: spin 2s linear infinite;
                position: absolute;

            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
<h1>Det er mer en 50% sjans for att du suger kuk</h1>
        <div class="spinnerContainer">
            <div class="spinner"></div>
        </div>
        <div class="message" style="display: none;">
            <h1>This takes longer than usual are you sure the venue is open?</h1>
            <p>If you have the password you can set the redirect up <a href="/admin.html">By clicking here</a></p>
        </div>
        <script>
            setTimeout(() => {
                document.querySelector('.spinner').style.display = 'none'
                document.querySelector('.message').style.display = 'block'
            }, 30000)
            const socket = new WebSocket('wss://websocket.ericbetts.dev')
            const sha256OfPassword = "a70a82628f334c23ff5a0ab0dbc086725ec3c56d3b5745024d6cd4d751a3213d"

            socket.addEventListener('open', function (event) {
                console.log('Connected to the WebSocket server')
                const subscription = {
                    action: 'subscribe',
                    key: sha256OfPassword
                }
                socket.send(JSON.stringify(subscription))
            })

            socket.addEventListener('message', function (event) {
                console.log('Message from server ', event.data)
                const data = JSON.parse(event.data)
                if (data.url) {
                    window.location.href = data.url
                }
            })
        </script>
    </body>

</html>
